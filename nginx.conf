server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # ^~ garante que /api/ nunca caia nas regex abaixo
  location ^~ /api/ {
    proxy_pass http://host.docker.internal:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Runtime do PWA: navegador precisa revalidar a cada load
  # para detectar novas versões do app (autoUpdate)
  location ~* (sw\.js|workbox-.*\.js)$ {
    add_header Cache-Control "no-cache";
  }

  # Android Chrome exige application/manifest+json para instalar o app
  # (o mime.types do nginx não mapeia .webmanifest)
  location ~* \.webmanifest$ {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache";
  }
}
